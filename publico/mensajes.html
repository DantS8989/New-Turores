<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes — TutoresOn-Line</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="recursos/estilos/style.css">
</head>
<body data-page="mensajes">

  <div class="ambient-glow"></div>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">T</div>
        TutoresOn<span>-Line</span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">Inicio</a>
        <a href="mensajes.html" class="btn btn-ghost btn-sm">Mensajes</a>
        <div id="nav-user-actions" style="display: none; align-items: center; gap: 10px;">
          <a href="perfil.html" class="user-menu-pill">
            <div class="user-avatar-circle" id="nav-user-avatar">U</div>
            <div class="user-info-text">
              <span class="user-info-name" id="nav-user-name">Usuario</span>
              <span class="user-info-role" id="nav-user-role">Rol</span>
            </div>
          </a>
          <form action="api/logout.php" method="POST" class="logout-form">
            <input type="hidden" name="csrf_token" value="">
            <button type="submit" class="btn btn-danger-outline btn-sm">Salir</button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="container page-narrow">

      <div id="auth-alert" class="alert alert-danger" style="display: none;">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div id="auth-alert-message"></div>
      </div>

      <section class="profile-card">
        <h1 class="profile-title">Mensajes</h1>
        <div class="tabs" role="tablist">
          <button type="button" class="tab-btn active" data-tab="received" role="tab">Recibidos</button>
          <button type="button" class="tab-btn" data-tab="sent" role="tab">Enviados</button>
        </div>
        <div id="messages-received" class="msg-list" aria-live="polite"></div>
        <div id="messages-sent" class="msg-list" style="display: none;"></div>
        <p id="messages-empty" class="tutors-empty" style="display: none;"></p>
      </section>

    </div>
  </main>

  <div id="toast-box" class="toast-container" style="display: none;">
    <div class="toast">
      <span id="toast-icon" class="toast-icon">✓</span>
      <span id="toast-message"></span>
    </div>
  </div>

  <footer class="footer" style="padding: 24px 0; margin-top: auto;">
    <div class="container" style="text-align: center; font-size: 13px; color: #64748B;">
      &copy; 2026 TutoresOn-Line. Todos los derechos reservados.
    </div>
  </footer>

  <script src="recursos/scripts/main.js" defer></script>
  <script src="recursos/scripts/paginas.js" defer></script>
</body>
</html>
